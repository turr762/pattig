<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Exambro</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 15px; font-size: 14px; text-align: left; background: #e9ecef; padding: 10px; border-radius: 4px; display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Buat Ujian Baru</h3>
        <input type="text" id="gformLink" placeholder="Link Google Form" required>
        <input type="datetime-local" id="expiryDate" required>
        <input type="text" id="exitPassword" placeholder="Password Keluar" required>
        <button onclick="buatUjian()">Generate Kode Ujian</button>
        <div id="result"></div>
    </div>

    <script>
        // URL DATABASE KAMU SUDAH OTOMATIS DISINI
        const FIREBASE_URL = "https://pattig-82484-default-rtdb.asia-southeast1.firebasedatabase.app/exams";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function generateId() {
            return Math.random().toString(36).substr(2, 9).toUpperCase();
        }

        async function buatUjian() {
            const link = document.getElementById("gformLink").value;
            const expiry = new Date(document.getElementById("expiryDate").value).getTime();
            const password = document.getElementById("exitPassword").value;

            if(!link || !expiry || !password) {
                alert("Mohon isi semua kolom!");
                return;
            }

            const rawId = generateId();
            const hashedId = await sha256(rawId);
            const hashedPassword = await sha256(password);

            const data = {
                link: link,
                expiry: expiry,
                passwordHash: hashedPassword
            };

            fetch(`${FIREBASE_URL}/${hashedId}.json`, {
                method: 'PUT',
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                const resDiv = document.getElementById("result");
                resDiv.style.display = "block";
                resDiv.innerHTML = `
                    <strong style="color:green">Berhasil Disimpan!</strong><br><br>
                    Berikan ID ini ke siswa:<br>
                    <b style="font-size:18px">${rawId}</b><br><br>
                    Password Keluar: <b>${password}</b>
                `;
            })
            .catch(error => alert("Gagal menyimpan data: " + error));
        }
    </script>
</body>
</html>
